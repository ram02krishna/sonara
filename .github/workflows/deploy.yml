name: Build to Docker Hub & Deploy to EC2

# Every push to `main`:
#   1. Runs the CI checks (lint, tests, build) via ci.yml.
#   2. Builds the API Docker image and pushes it to Docker Hub.
#   3. Connects to EC2 via SSH, syncs configuration, pulls the new image from Docker Hub, and restarts the stack.
#   4. Verifies the /healthz healthcheck.
#
# Setup instructions: docs/DEPLOYMENT.md

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    with:
      docker-build: false

  build-and-push:
    name: Build & push to Docker Hub
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sonara-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sonara-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Sync compose & nginx configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "mkdir -p ~/sonara"
          tar -czf - -C infra/aws docker-compose.prod.yml nginx \
            | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "tar -xzf - -C ~/sonara"

      - name: Pull image from Docker Hub & restart on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "$EC2_USER@$EC2_HOST" "
            cd ~/sonara &&
            if [ -n '$DOCKERHUB_TOKEN' ]; then
              echo '$DOCKERHUB_TOKEN' | docker login -u '$DOCKERHUB_USERNAME' --password-stdin || true
            fi &&
            DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' docker compose -f docker-compose.prod.yml pull api &&
            DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' docker compose -f docker-compose.prod.yml up -d --remove-orphans
          "

      - name: Verify API health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            cd ~/sonara
            echo "Waiting for API service to become healthy..."
            for i in $(seq 1 30); do
              cid=$(docker compose -f docker-compose.prod.yml ps -q api 2>/dev/null || true)
              status=$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}" "$cid" 2>/dev/null || echo "starting")
              if [ "$status" = "healthy" ]; then
                echo "Sonara API is healthy!"
                docker compose -f docker-compose.prod.yml ps
                exit 0
              fi
              sleep 2
            done
            echo "Healthcheck timeout. Showing API logs:"
            docker compose -f docker-compose.prod.yml logs --tail 60 api
            exit 1
          '
