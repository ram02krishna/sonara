name: CI

# Runs on pull requests and on pushes to `develop`.
# Pushes to `main` run it through deploy.yml (which calls this workflow first),
# so code is always tested before it is built and shipped.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_call:
    inputs:
      docker-build:
        description: "Also verify that both Docker images build"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint --workspace=apps/web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Go vet
        run: |
          cd apps/api
          go vet ./...

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sonara
          POSTGRES_PASSWORD: sonarasecret
          POSTGRES_DB: sonara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Run backend tests
        env:
          DATABASE_URL: postgres://sonara:sonarasecret@localhost:5432/sonara_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: test-session-secret-key-must-be-32bytes!
        run: |
          cd apps/api
          go test -v -race ./...

  build-artifacts:
    name: Build web & API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web
        run: npm run build --workspace=apps/web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/api/go.sum

      - name: Build API binary
        run: |
          cd apps/api
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/server ./cmd/server

  docker-build:
    name: Docker images build
    # Skipped when deploy.yml calls this workflow with docker-build: false (it builds the API image itself).
    if: ${{ inputs.docker-build != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
