services:
  - type: web
    name: sonara-api
    runtime: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: sonara-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://sonara.vercel.app

databases:
  - name: sonara-db
    plan: free
    databaseName: sonara
    user: sonara
